name: zest-test
description: "Run the unit tests, the tooling tests, and the builds."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 1800
  priority: 10
  working_dir: /job
  resources:
    cpu:
      request: "1"
      limit: "4"
    memory:
      limit: "4Gi"
environment:
  ZEST_JOB: test
run_local:
  user: host
