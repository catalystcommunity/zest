# Desired secret grants for the Zest project. One job holds every grant, and it is
# the only job that publishes. Each other job runs with no grant, which makes a pull
# request from a fork safe to run.
#
# Review the live grants and use a dry run before you apply this file. The file
# does not prune, because an apply must not remove an unrecorded production grant.
#
# The grant subject is the workflow node name.
apiVersion: reactorcide.catalystcommunity.io/v1alpha1
kind: SecretGrantList
items:
  - metadata:
      name: zest-release-ci
    spec:
      scope:
        project: github.com/catalystcommunity/zest
      secret:
        path: catalystcommunity/ci
        match: exact
      subject:
        jobName:
          value: zest-release
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
      description: "Push the release commit and tags, and stage each package on npm."
