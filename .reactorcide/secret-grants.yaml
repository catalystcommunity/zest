# Desired secret grants for the Zest project. Two jobs hold grants: the release job,
# which publishes the packages, and the site deploy job. Both run only after a merge.
# Each other job runs with no grant, which makes a pull request from a fork safe to run.
#
# Review the live grants and use a dry run before you apply this file. The file
# does not prune, because an apply must not remove an unrecorded production grant.
#
# The grant subject is the workflow node name.
apiVersion: reactorcide.catalystcommunity.io/v1alpha1
kind: SecretGrantList
items:
  - metadata:
      name: zest-release-ci
    spec:
      scope:
        project: github.com/catalystcommunity/zest
      secret:
        path: catalystcommunity/ci
        match: exact
      subject:
        jobName:
          value: zest-release
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
      description: "Push the release commit and tags, and stage each package on npm."

  - metadata:
      name: zest-website-deploy-registry
    spec:
      scope:
        project: github.com/catalystcommunity/zest
      secret:
        path: catalystcommunity/registry
        match: exact
      subject:
        jobName:
          value: zest-website-deploy
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
      description: "Push the demo site image and create the namespace pull secret."

  - metadata:
      name: zest-website-deploy-ci
    spec:
      scope:
        project: github.com/catalystcommunity/zest
      secret:
        path: catalystcommunity/ci
        match: exact
      subject:
        jobName:
          value: zest-website-deploy
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
      description: "Push the website/vX.Y.Z tag after the demo site deploys."

  - metadata:
      name: zest-website-deploy-k8s
    spec:
      scope:
        project: github.com/catalystcommunity/zest
      secret:
        path: catalystcommunity/k8s
        match: exact
      subject:
        jobName:
          value: zest-website-deploy
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
      description: "Roll the demo site Helm release and apply its route."
