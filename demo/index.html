<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/caldo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zest Components Demo</title>
  </head>
  <body>
    <template id="demo-gutter">
      <img src="/caldo.svg" alt="">
      <span>&copy; Catalyst Squad</span>
    </template>
    <template id="gallery-gutter">
      <span data-testid="gutter-override-content">Text from a template</span>
      <img src="/caldo.svg" alt="" width="24">
    </template>
    <template id="gallery-red-styles">
      <style>:host, .red-text { color: light-dark(#c0392b, #ff9a8f); font-weight: bold; }</style>
    </template>
    <template id="gallery-base-template">
      <p data-testid="base-override-content">This text comes from an override template.</p>
    </template>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
